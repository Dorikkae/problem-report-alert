name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (example 1.1.3)
        required: true
        default: "1.1.4"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "ProblemReportAlert" --collect-all selenium --add-data "static;static" app.py

      - name: Calculate SHA256
        id: hash
        shell: pwsh
        run: |
          $hash=(Get-FileHash "dist\ProblemReportAlert.exe" -Algorithm SHA256).Hash.ToLower()
          "sha=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: 문제보고 알림 v${{ inputs.version }}
          files: dist/ProblemReportAlert.exe
          generate_release_notes: true

      - name: Update manifest
        shell: pwsh
        run: |
          $obj = [ordered]@{
            version = "${{ inputs.version }}"
            url = "https://github.com/Dorikkae/problem-report-alert/releases/download/v${{ inputs.version }}/ProblemReportAlert.exe"
            sha256 = "${{ steps.hash.outputs.sha }}"
          }
          $obj | ConvertTo-Json | Set-Content -Encoding utf8 manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest to v${{ inputs.version }}" || exit 0
          git push
